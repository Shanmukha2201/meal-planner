<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veg Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:#4a4033;min-height:100vh;position:relative;
 background:linear-gradient(135deg,#f7f1e4 0%,#f1ebdc 45%,#e8eedd 100%);background-attachment:fixed}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#bg span{position:absolute;opacity:.28;user-select:none;animation:fl 6s ease-in-out infinite;filter:saturate(.6) drop-shadow(0 3px 3px rgba(100,80,50,.12))}
@keyframes fl{0%,100%{translate:0 0}50%{translate:0 -12px}}
@media (prefers-reduced-motion:reduce){#bg span{animation:none}}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 14px 48px}
header{text-align:center;margin-bottom:22px}
h1{font-family:'Playfair Display',serif;font-size:clamp(30px,6vw,48px);margin:0;color:#5f7c55}
header p{margin:4px 0 14px;font-weight:600}
.picker{display:inline-flex;gap:10px;align-items:center;background:#fffdf7;border:2px dashed #b9a98c;border-radius:16px;padding:10px 18px;box-shadow:0 4px 12px #6a583a1f}
.picker label{font-weight:700}
input[type=month]{font:inherit;padding:8px 10px;border:1px solid #e6d8bd;border-radius:8px;background:#fff;color:#3b2f22}
.week{background:#fffdf7ee;border-radius:18px;margin-bottom:18px;box-shadow:0 4px 12px #6a583a1f;overflow:hidden;border:1px solid #e7dcc4}
.week h2{font-family:'Playfair Display',serif;margin:0;padding:10px 16px;font-size:20px;color:#fff;background:var(--c);font-weight:600}
.week:nth-child(4n+1){--c:#c49a7a}.week:nth-child(4n+2){--c:#8fa684}.week:nth-child(4n+3){--c:#b99ca0}.week:nth-child(4n+4){--c:#9c9db8}
.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px}
.cell{background:#fff;border:1px solid #ece2cc;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.cell .d{font-family:'Playfair Display',serif;font-weight:700;font-size:22px;color:var(--c);line-height:1}
.meal{display:flex;align-items:center;gap:6px;min-height:34px;border-radius:9px;padding:3px 6px;background:var(--m)}
.meal.b{--m:#f8efd9}.meal.l{--m:#e9f0e1}.meal.s{--m:#f5e6e6}
.lbl{font-size:18px;flex:none}
.dish{flex:1;font-size:14px;font-weight:700;word-break:break-word}
.empty{flex:1;font-size:13px;opacity:.5;cursor:pointer}
.meal input{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 6px;border:1px solid #d9c9a8;border-radius:7px}
button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:7px;padding:5px 8px;cursor:pointer;color:#fff;background:#7f9a73}
button.edit{background:#c49a7a}button.del{background:#c9bda6}
.note{text-align:center;font-size:13px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <header>
    <h1>🥗 Veg Meal Planner</h1>
    <p>Breakfast, lunch &amp; snacks for every date — 100% vegetarian</p>
    <div class="picker"><label for="month">Month</label><input type="month" id="month"></div>
  </header>
  <div id="planner"></div>
  <p class="note">Saved in your browser on this device.</p>
</main>
<script>
(function(){
  const icons=['🥕','🍅','🥦','🌽','🫑','🍆','🥬','🧅','🥒','🍄','🫛','🥔','🍋','🥣','🥘','🍲','🫕','🥄','🍴','🔪','🍚','🫓','🥗','🌿','🧄','🥜','🍎','🍌','🍇','🍉','🥭','🍓','🥑','🫒','🧁','🍵','🥞','🍛','🥪','🫘'];
  const bg=document.getElementById('bg'),step=110;
  const cols=Math.ceil(innerWidth/step)+1,rows=Math.ceil(innerHeight/step)+1;
  let i=0;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const s=document.createElement('span');
    s.textContent=icons[(i++*7+r*3)%icons.length];
    s.style.left=(c*step+(r%2?55:0)+Math.random()*20-10)+'px';
    s.style.top=(r*step+Math.random()*20-10)+'px';
    s.style.fontSize=(38+Math.random()*28)+'px';
    s.style.rotate=(Math.random()*60-30)+'deg';
    s.style.animationDelay=(-Math.random()*6)+'s';
    s.style.animationDuration=(5+Math.random()*4)+'s';
    bg.appendChild(s);
  }
})();

const MEALS=[['b','🥞','Breakfast'],['l','🍛','Lunch'],['s','🍿','Snacks']];
const monthInput=document.getElementById('month'),planner=document.getElementById('planner');
const KEY='vegPlannerMeals';
let data={};
try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function row(k,m,editing){
  const [id,ico,name]=MEALS.find(x=>x[0]===m),v=data[k+'-'+m];
  let inner;
  if(editing||!v) inner=`<input type="text" placeholder="${name}" maxlength="60" value="${v?esc(v):''}"><button data-a="save">Save</button>`+(editing&&v?'<button class="del" data-a="cancel">✕</button>':'');
  else inner=`<span class="dish">${esc(v)}</span><button class="edit" data-a="edit">Edit</button><button class="del" data-a="del">✕</button>`;
  return `<div class="meal ${id}" data-k="${k}" data-m="${m}" title="${name}"><span class="lbl">${ico}</span>${inner}</div>`;
}

function render(){
  const m=monthInput.value;
  if(!m){planner.innerHTML='<p style="text-align:center;font-weight:700">Pick a month to begin 🌱</p>';return}
  const [y,mo]=m.split('-').map(Number),days=new Date(y,mo,0).getDate();
  let html='';
  for(let w=0;w<Math.ceil(days/7);w++){
    html+=`<section class="week"><h2>Week ${w+1}</h2><div class="dates">`;
    for(let d=w*7+1;d<=Math.min(days,w*7+7);d++){
      const k=m+'-'+d;
      html+=`<div class="cell"><div class="d">${d}</div>${MEALS.map(x=>row(k,x[0])).join('')}</div>`;
    }
    html+='</div></section>';
  }
  planner.innerHTML=html;
}

planner.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const el=b.closest('.meal'),k=el.dataset.k,m=el.dataset.m,a=b.dataset.a,key=k+'-'+m;
  if(a==='save'){const v=el.querySelector('input').value.trim();if(v){data[key]=v;persist()}}
  if(a==='del'){delete data[key];persist()}
  el.outerHTML=row(k,m,a==='edit');
  if(a==='edit'){const i=planner.querySelector(`.meal[data-k="${k}"][data-m="${m}"] input`);i.focus();i.select()}
});
planner.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.parentElement.querySelector('[data-a=save]').click();
});

const now=new Date();
let saved='';try{saved=localStorage.getItem('vegPlannerMonth')||''}catch(e){}
monthInput.value=saved||now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
monthInput.addEventListener('change',()=>{try{localStorage.setItem('vegPlannerMonth',monthInput.value)}catch(e){}render()});
render();
</script>
</body>
</html>
